name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build application
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
          DIRECT_URL: "postgresql://ci_user:ci_password@localhost:5432/ci_db"
          AUTH_SECRET: "ci-secret-key-placeholder-min-32-chars-long"
          AUTH_GOOGLE_ID: "ci-google-id-placeholder"
          AUTH_GOOGLE_SECRET: "ci-google-secret-placeholder"
          GEMINI_API_KEY: "ci-gemini-key-placeholder"
          NEXT_PUBLIC_APP_URL: "https://devleveler.vercel.app"
        run: npm run build
